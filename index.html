<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigator SK Mawar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<h1>🏫 Navigator SK Mawar</h1>

<p>Aplikasi Navigasi Sekolah</p>

</header>

<div class="container">

<input
type="text"
id="searchBox"
placeholder="Cari lokasi..."
onkeyup="searchLocation()">

<div class="card">

<h2>Senarai Lokasi</h2>

<ul id="locationList">

<li onclick="showLocation('Pejabat','images/pejabat.png')">
📍 Pejabat
</li>

<li onclick="showLocation('Kantin','images/kantin.png')">
🍽 Kantin
</li>

<li onclick="showLocation('Makmal Komputer','images/makmal.png')">
💻 Makmal Komputer
</li>

<li onclick="showLocation('Surau','images/surau.png')">
🕌 Surau
</li>

<li onclick="showLocation('Dewan','images/dewan.png')">
🏢 Dewan
</li>

</ul>

</div>

<div class="card">

<h2 id="title">Lokasi</h2>

<img
id="locationImage"
src="images/sekolah.jpg"
alt="Lokasi">

<p id="description">

Klik lokasi untuk melihat maklumat.

</p>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
